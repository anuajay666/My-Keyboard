# Codemagic CI: builds a debug APK of the keyboard.
workflows:
  debug-apk:
    name: Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Rust toolchain (needed by the native library)
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          "$HOME/.cargo/bin/rustc" --version
      - name: Accept Android SDK licenses
        script: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Check the APK (flags and signature)
        script: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          APK=app/build/intermediates/apk/debug/app-debug.apk
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|testOnly|sdkVersion|targetSdk|native-code" || true
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | grep -i -E "testOnly|debuggable" || true
          "$BT/apksigner" verify --verbose --print-certs "$APK" | head -8 || true
      - name: Show where the APK landed
        script: |
          find . -name "*.apk" -not -path "./.git/*" -exec ls -la {} \;
    artifacts:
      - app/build/intermediates/apk/debug/*.apk
      - app/build/outputs/**/*.apk
